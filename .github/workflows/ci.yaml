name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Check the app import
        run: python -c "from app.main import app; print('App import successful')"
      - name: Run tests with coverage
        run: python -m pytest -v --cov=app --cov-report=term-missing --cov-fail-under=80

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Build image
        run: docker build -t fastapi-cicd:${{ github.sha }} .
      - name: Run container
        run: docker run -d --name api -p 8000:8000 fastapi-cicd:${{ github.sha }}
      - name: Smoke test /health
        run: |
          for i in $(seq 1 15); do
            if curl --fail --silent http://localhost:8000/health; then
              echo
              echo "healthy after $i attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "health check failed"
          exit 1
      - name: Show container logs
        if: always()
        run: docker logs api